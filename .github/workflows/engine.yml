name: Engine

on:
  push:
    branches: ["main"]
    tags: ["bgb-engine-v*"]
    paths:
      - "packages/bgb-engine/**"
  pull_request:
    paths:
      - "packages/bgb-engine/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Type check the engine
        run: uv run --no-sync mypy packages/bgb-engine/src

      - name: Run engine tests
        run: uv run --no-sync python -m unittest discover -s packages/bgb-engine/tests -v

      - name: Build the engine package
        run: uv build --package bgb-engine -o dist/bgb-engine

      - name: Upload distributions
        if: startsWith(github.ref, 'refs/tags/bgb-engine-v')
        uses: actions/upload-artifact@v4
        with:
          name: bgb-engine-dist
          path: dist/bgb-engine/*
          if-no-files-found: error

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/bgb-engine-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: bgb-engine-dist
          path: dist/bgb-engine

      - name: Verify release tag
        run: |
          WHEEL=$(ls dist/bgb-engine/*.whl)
          VERSION=$(basename "$WHEEL" | sed -E 's/^bgb_engine-(.*)-py3-none-any\.whl$/\1/')
          test "bgb-engine-v${VERSION}" = "${GITHUB_REF_NAME}"

      - name: Publish to PyPI
        run: uv publish dist/bgb-engine/* --trusted-publishing always
